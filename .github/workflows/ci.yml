name: Update ASN Lists

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests lxml

      - name: Generate ASN lists and filter configs
        run: python scripts/generate_asn_lists.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Daily update: ASN lists and filter configs"
